# =============================================================================
# MASTER CONFIGURATION HUB (config.toml)
# =============================================================================
# All execution scripts (train.py, evaluate.py, inference.py, prepare_data.py)
# automatically read this file. Detailed configurations are split into 4 files:
#   1. configs/project.toml  : Hardware device, data types, checkpoints & paths
#   2. configs/model.toml    : Model architecture & scale presets (10M -> 7B+)
#   3. configs/training.toml : Muon+AdamW optimizers, WSD scheduler, Masked Diffusion
#   4. configs/datasets.toml : Data sources [[data.sources]] & mixing weights
#
# TIP: Any key defined directly below will automatically OVERRIDE values
# from included sub-configs.
# =============================================================================

includes = [
    "configs/project.toml",
    "configs/model.toml",
    "configs/training.toml",
    "configs/datasets.toml",
]

# --- Quick inline overrides example ---
# [model]
# scale_preset = "100m"
#
# [training]
# stage = "pretrain"
# micro_batch_size = 64
# save_interval = 50
