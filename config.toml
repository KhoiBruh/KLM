# =============================================================================
# TỆP ĐIỀU PHỐI CẤU HÌNH TRUNG TÂM (MASTER CONFIG HUB - config.toml)
# =============================================================================
# Mọi kịch bản (train.py, evaluate.py, inference.py, prepare_data.py) tự động đọc tệp này.
# Cấu hình chi tiết được tách thành 4 tệp chuyên biệt trong thư mục `configs/`:
#   1. configs/project.toml  : Thiết bị (CUDA/CPU), kiểu dữ liệu, Safetensors & đường dẫn
#   2. configs/model.toml    : Kiến trúc mô hình & các preset mở rộng (10M -> 7B+)
#   3. configs/training.toml : Bộ tối ưu Muon+AdamW, lịch WSD, TST & RL GRPO
#   4. configs/datasets.toml : Khai báo các nguồn dữ liệu [[data.sources]] & tỷ lệ trộn
#
# MẸO: Bất kỳ khóa nào bạn khai báo thêm ở bên dưới tệp này sẽ tự động GHI ĐÈ (override)
# lên giá trị tương ứng trong các tệp thuộc `includes`.
# =============================================================================

includes = [
    "configs/project.toml",
    "configs/model.toml",
    "configs/training.toml",
    "configs/datasets.toml",
]

# --- Ví dụ ghi đè nhanh tại chỗ (bỏ dấu # nếu muốn thử nghiệm nhanh) ---
