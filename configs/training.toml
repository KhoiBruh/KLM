# =============================================================================
# 3. CẤU HÌNH HUẤN LUYỆN, TỐI ƯU HÓA & RL GRPO (configs/training.toml)
# =============================================================================

[optimizer]
# Lai ghép Muon (cho ma trận 2D ẩn) + AdamW (cho Embedding, Norm, Bias)
muon_lr = 0.02
muon_momentum = 0.95
muon_ns_steps = 5             # Số bước lặp Newton-Schulz bậc 5 trực giao hóa
adamw_lr = 0.003
weight_decay = 0.01
betas = [0.9, 0.95]
grad_clip = 1.0

[training]
stage = "pretrain"            # Chế độ: "pretrain", "sft", "grpo"
micro_batch_size = 64         # Tối ưu cho RTX 3050 4GB (~2.6GB VRAM). Tăng lên 256 trên A100 / H100
grad_accum_steps = 8          # Global batch = 64 * 8 = 512 chuỗi
total_steps = 100000
warmup_ratio = 0.03           # Lịch trình WSD: 3% Warmup -> 82% Stable -> 15% Decay
stable_ratio = 0.82
decay_ratio = 0.15
use_tst = true                # Token Superposition Training (gộp token ở giai đoạn đầu để tăng tốc)
tst_ratio = 0.30              # Chạy TST trong 30% số bước đầu tiên
tst_pool_factor = 4           # Gộp 4 tokens làm 1
gradient_checkpointing = true # Tiết kiệm VRAM cho RTX 3050 4GB và bắt buộc cho quy mô 1B-7B+
distributed_strategy = "auto" # Hỗ trợ: "auto", "none", "ddp", "fsdp" (FSDP ZeRO-3 cho quy mô nhiều tỷ tham số)
low_cpu_mem_usage = false     # Khởi tạo trên meta device khi nạp mô hình hàng tỷ tham số
eval_interval = 1000
save_interval = 50

[rl_grpo]
group_size = 8                # Số câu trả lời sinh ra cho mỗi prompt (G=8)
kl_coef = 0.04
max_gen_len = 256
learning_rate = 1e-5
steps = 2000
