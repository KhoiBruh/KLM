# =============================================================================
# 2. CẤU HÌNH KIẾN TRÚC MÔ HÌNH (configs/model.toml)
# =============================================================================

[model]
# Chế độ quy mô (Preset): "custom" (dùng thông số bên dưới), hoặc "10m", "100m", "500m", "1b", "3b", "7b"
scale_preset = "custom"

# Cấu hình mặc định sát nút ~9.98M tham số (< 10,000,000 tham số khi inference)
# Tham khảo nhanh các quy mô lớn hơn (hoặc đổi trực tiếp scale_preset ở trên):
# - 100M (<150M): vocab=32768, d_model=640,  n_layers=28, n_heads=10, n_kv_heads=2, head_dim=64,  d_ff=1760
# - 500M (<500M): vocab=32768, d_model=1152, n_layers=28, n_heads=18, n_kv_heads=6, head_dim=64,  d_ff=3328
# - 1B   (~1.0B): vocab=65536, d_model=1536, n_layers=32, n_heads=24, n_kv_heads=4, head_dim=64,  d_ff=4096
# - 3B   (~2.9B): vocab=65536, d_model=2560, n_layers=36, n_heads=32, n_kv_heads=8, head_dim=80,  d_ff=6912
# - 7B   (~6.9B): vocab=128256, d_model=4096, n_layers=32, n_heads=32, n_kv_heads=8, head_dim=128, d_ff=11008
vocab_size = 4096
d_model = 256
n_layers = 12
n_heads = 8
n_kv_heads = 2                # Grouped-Query Attention (GQA 4:1)
head_dim = 32
d_ff = 688                    # SwiGLU intermediate size (căn chỉnh để tổng param < 10,000,000)
max_seq_len = 1024
rope_theta = 10000.0
rope_scaling_factor = 1.0     # Mở rộng ngữ cảnh Dynamic NTK / YaRN cho mô hình lớn
dropout = 0.0
tie_word_embeddings = true

# Các vũ khí kiến trúc đặc biệt
use_qk_norm = true            # RMSNorm trên Q và K chống nổ gradient khi dùng Muon
use_attn_output_gate = true   # Cổng Sigmoid lọc nhiễu đầu ra Attention (Qwen3.5/ForgePlex style)
attn_gate_rank = 98           # Hạng chiếu cổng Attention (0 = chiếu full-rank; 98 giúp bản 10M đạt chuẩn ~9.98M)
use_short_conv = true         # Depthwise Conv1d (kernel=5) trước QKV giúp bắt ngữ cảnh cục bộ BPE
short_conv_kernel = 5
use_dense_connections = true  # DenseFormer: Kết nối trọng số học được xuyên qua mọi tầng trước đó
mtp_num_heads = 1             # Multi-Token Prediction: dự đoán thêm token t+2 lúc train (tự cắt bỏ khi inference)
chunked_loss_size = 0         # Đặt > 0 (ví dụ 4096) khi huấn luyện mô hình 1B-7B+ vocab lớn để tiết kiệm VRAM
