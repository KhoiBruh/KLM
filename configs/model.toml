# =============================================================================
# 2. MODEL ARCHITECTURE CONFIGURATION (configs/model.toml)
# =============================================================================

[model]
# Scaling preset: "custom" (uses parameters below), or "10m", "100m", "500m", "1b", "3b", "7b"
scale_preset = "custom"

# Standard LLaDA architecture (Large Language Diffusion with Masking - Bidirectional Transformer)
# Optimized for the <10M parameter regime (~9.36M params with tied embeddings)
vocab_size = 4096
d_model = 256
n_layers = 12
n_heads = 8
n_kv_heads = 2                # Grouped-Query Attention (GQA 4:1)
head_dim = 32
d_ff = 688                    # SwiGLU intermediate size (<10M params)
max_seq_len = 1024
rope_theta = 10000.0
rope_scaling_factor = 1.0
dropout = 0.0
tie_word_embeddings = true
use_qk_norm = true            # RMSNorm on Q and K for stable diffusion dynamics

# LLaDA Diffusion parameters
mask_token_id = 4             # Token ID for <|mask|>
sampling_steps = 64           # Number of diffusion denoising steps during generation
