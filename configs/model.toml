# =============================================================================
# 2. MODEL ARCHITECTURE CONFIGURATION (configs/model.toml)
# =============================================================================

[model]
# Scaling preset: "custom" (uses parameters below), or "10m", "100m", "200m", "500m", "1b", "3b", "7b"
scale_preset = "200m"

# Standard LLaDA architecture (Large Language Diffusion with Masking - Bidirectional Transformer)
# Optimized for the ~200M parameter regime (~201.37M params with tied 32K embeddings)
vocab_size = 32768
d_model = 768
n_layers = 28
n_heads = 12
n_kv_heads = 4                # Grouped-Query Attention (GQA 3:1)
head_dim = 64
d_ff = 2048                   # SwiGLU intermediate size (~201.37M params, Tensor Core aligned)
max_seq_len = 1024
rope_theta = 10000.0
rope_scaling_factor = 1.0
dropout = 0.0
tie_word_embeddings = true
use_qk_norm = true            # RMSNorm on Q and K for stable diffusion dynamics

# LLaDA Diffusion parameters
mask_token_id = 4             # Token ID for <|mask|>
sampling_steps = 64           # Number of diffusion denoising steps during generation
