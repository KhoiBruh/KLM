# =============================================================================
# 2. CẤU HÌNH KIẾN TRÚC MÔ HÌNH LLADA (configs/model.toml)
# =============================================================================

[model]
# Chế độ quy mô (Preset): "custom" (dùng thông số bên dưới), hoặc "10m", "100m", "500m", "1b", "3b", "7b"
scale_preset = "custom"

# Cấu hình chuẩn LLaDA (Large Language Diffusion with Masking)
# Thiết kế tối ưu phân khúc <10M tham số (~9.36M params khi tied embeddings)
vocab_size = 4096
d_model = 256
n_layers = 12
n_heads = 8
n_kv_heads = 2                # Grouped-Query Attention (GQA 4:1)
head_dim = 32
d_ff = 688                    # SwiGLU intermediate size (<10M params)
max_seq_len = 1024
rope_theta = 10000.0
rope_scaling_factor = 1.0
dropout = 0.0
tie_word_embeddings = true
use_qk_norm = true            # RMSNorm trên Q và K ổn định hóa phân bố khuếch tán

# Tham số Diffusion LLaDA
mask_token_id = 4             # Token ID của <|mask|>
sampling_steps = 64           # Số bước khử nhiễu khi sinh văn bản
