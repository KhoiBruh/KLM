# =============================================================================
# 4. CẤU HÌNH TẬP DỮ LIỆU & PHỐI TRỘN ĐA NGUỒN (configs/datasets.toml)
# =============================================================================
# Mỗi nguồn dữ liệu là một khối [[data.sources]].
# - Nếu chưa bật nguồn nào cho stage hiện tại -> tự động dùng dữ liệu toán giả lập.
# - Dữ liệu thô được token hóa 1 lần thành các shard nhị phân (.bin) trong `cache_dir`
#   (tự động cập nhật lại khi đổi cấu hình nguồn hoặc đổi tokenizer).
# - Có thể chuẩn bị trước bằng lệnh: python prepare_data.py
# =============================================================================

[data]
cache_dir = "data/cache"
shard_size_tokens = 100_000_000   # ~200MB/shard (uint16). Quy mô frontier: giữ nguyên, chỉ số shard tăng lên
val_ratio = 0.005                 # 0.5% tài liệu tách riêng cho tập validation
append_eos = true                 # Chèn <|eos|> giữa các tài liệu khi đóng gói chuỗi
prepend_bos = false
tokenize_batch_size = 1024        # Số tài liệu mỗi lô khi token hóa bằng Rust đa luồng
synthetic_fallback = true         # Tự động sinh dữ liệu toán/logic giả lập nếu chưa khai báo nguồn nào

# -----------------------------------------------------------------------------
# HƯỚNG DẪN CÁC TRƯỜNG CỦA [[data.sources]]:
# - name          : Tên định danh duy nhất (dùng tạo thư mục cache & tham chiếu ở [[data.phases]])
# - type          : "text" | "jsonl" | "parquet" | "hf" | "bin"
# - path          : Đường dẫn / glob / danh sách glob (hỗ trợ cả tệp nén .gz)
# - weight        : Trọng số lấy mẫu (tỷ lệ trộn ∝ weight, độc lập với kích thước bộ dữ liệu)
# - stages        : Danh sách giai đoạn áp dụng, vd: ["pretrain"], ["sft"], ["pretrain", "sft"]
# - text_field    : Tên trường văn bản (jsonl/parquet/hf). Nếu có `messages=[{role, content}]` sẽ tự format chat
# - template      : Mẫu ghép nhiều trường, vd: "<|user|> {question} <|assistant|> {answer}"
# - doc_separator : Ký tự tách tài liệu cho tệp .txt (vd: "\n\n")
# - min_chars     : Lọc bỏ các tài liệu quá ngắn
# - max_docs      : Giới hạn số lượng tài liệu đọc tối đa (0 = không giới hạn)
# - max_tokens    : Giới hạn tổng số token mã hóa tối đa (0 = không giới hạn)
# - hf_name, hf_config, hf_split, hf_revision : Tham số khi dùng type = "hf" (cần `pip install datasets`)
# - enabled       : Đặt false nếu muốn tạm tắt nguồn mà không cần xóa cấu hình
# -----------------------------------------------------------------------------

