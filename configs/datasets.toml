# =============================================================================
# 4. DATASET & MULTI-SOURCE BLENDING CONFIGURATION (configs/datasets.toml)
# =============================================================================
# Each data source is declared as a [[data.sources]] block.
# - If no sources are enabled for current stage -> fallback to synthetic reasoning data.
# - Raw corpora are tokenized once into binary shards (.bin) inside `cache_dir`
#   (automatically regenerated if source configuration or tokenizer changes).
# - Pre-tokenize ahead of time using: python prepare_data.py
# =============================================================================

[data]
cache_dir = "data/cache"
shard_size_tokens = 100_000_000   # ~200MB/shard (uint16)
val_ratio = 0.005                 # 0.5% documents reserved for validation
append_eos = true                 # Append <|eos|> between documents
prepend_bos = false
tokenize_batch_size = 1024        # Batch size for multithreaded Rust tokenizer
synthetic_fallback = true         # Generate synthetic math/reasoning data if no sources exist

# -----------------------------------------------------------------------------
# FIELD GUIDE FOR [[data.sources]]:
# - name          : Unique identifier (used for cache folder & [[data.phases]])
# - type          : "text" | "jsonl" | "parquet" | "hf" | "bin"
# - path          : File path / glob / list of globs (supports .gz archives)
# - weight        : Sampling weight (sampling probability proportional to weight)
# - stages        : Stages to activate, e.g., ["pretrain"], ["sft"]
# - text_field    : Field containing text (jsonl/parquet/hf). `messages` formats chat
# - template      : Multi-field template, e.g. "<|user|> {question} <|assistant|> {answer}"
# - doc_separator : Document delimiter for .txt files (e.g. "\n\n")
# - min_chars     : Filter out documents shorter than this threshold
# - max_docs      : Maximum documents to read (0 = unlimited)
# - max_tokens    : Maximum tokens to encode (0 = unlimited)
# - hf_name, hf_config, hf_split, hf_revision : HuggingFace hub parameters
# - enabled       : Set to false to temporarily disable source without deletion
# -----------------------------------------------------------------------------

# --- Example 1: Plain text files (.txt / .md) ---
# [[data.sources]]
# name = "local_text"
# type = "text"
# path = "data/raw/**/*.txt"
# doc_separator = "\n\n"
# min_chars = 64
# stages = ["pretrain"]
# weight = 1.0

# --- Example 2: Hugging Face Hub Dataset (Streaming) ---
# [[data.sources]]
# name = "wiki_en"
# type = "hf"
# hf_name = "wikimedia/wikipedia"
# hf_config = "20231101.en"
# hf_split = "train"
# text_field = "text"
# max_tokens = 200_000_000
# stages = ["pretrain"]
# weight = 0.5

# --- Example 3: Parquet Datasets (FineWeb-Edu / Cosmopedia) ---
# [[data.sources]]
# name = "fineweb_edu"
# type = "parquet"
# path = ["data/fineweb-edu/*.parquet"]
# text_field = "text"
# min_chars = 200
# stages = ["pretrain"]
# weight = 0.4

# --- Example 4: SFT / Math Reasoning CoT Dataset (.jsonl / .jsonl.gz) ---
# [[data.sources]]
# name = "math_cot_sft"
# type = "jsonl"
# path = "data/sft/math/*.jsonl"
# template = "<|bos|><|user|> {question} <|assistant|><|think|> {reasoning} <|/think|><|answer|> {answer}"
# stages = ["sft"]
# weight = 1.0

# --- Example 5: Pre-tokenized binary shards (.bin) ---
# [[data.sources]]
# name = "external_bins"
# type = "bin"
# path = "data/tokens/*.bin"
# bin_dtype = "auto"
# stages = ["pretrain"]
# weight = 0.1

# -----------------------------------------------------------------------------
# DYNAMIC DATA BLENDING SCHEDULE (DATA ANNEALING / CURRICULUM - OPTIONAL)
# Applies the first phase where `progress < until` (progress = step / total_steps).
# Useful for increasing high-quality reasoning/math/code weights during WSD decay.
# -----------------------------------------------------------------------------
# [[data.phases]]
# until = 0.85
# weights = { wiki_en = 0.6, fineweb_edu = 0.4, external_bins = 0.0 }
#
# [[data.phases]]
# until = 1.0
# weights = { wiki_en = 0.2, fineweb_edu = 0.3, external_bins = 0.5 }
