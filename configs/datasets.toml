# =============================================================================
# 4. DATASET & MULTI-SOURCE BLENDING CONFIGURATION (configs/datasets.toml)
# =============================================================================
# Balanced 200M Context-Aware & Conversational SLM Recipe
# - Pretrain (~350M tokens): FineWeb-Edu + Cosmopedia-v2 + TinyStories + FineMath + OpenCoder
# - SFT (~90M tokens)      : SmolTalk (50%) + UltraChat-200k (35%) + OpenThoughts3 (15%)
#
# Usage:
#   1. Build custom 32K BPE tokenizer from active datasets:
#      python tokenizer/build_tokenizer.py
#   2. Pre-tokenize datasets into binary .bin shards:
#      python prepare_data.py
# =============================================================================

[data]
cache_dir = "data/cache"
shard_size_tokens = 50_000_000    # ~100MB/shard (uint16) - optimal for 100M-500M budget
val_ratio = 0.005                 # 0.5% documents reserved for validation
append_eos = true                 # Append <|eos|> between documents
prepend_bos = true                # Prepend <|bos|> at document start
tokenize_batch_size = 1024        # Batch size for multithreaded Rust tokenizer
synthetic_fallback = true         # Generate synthetic data if no sources exist

# =============================================================================
# STAGE 1: PRE-TRAINING SOURCES (~350M Tokens Total)
# Builds deep English fluency, world knowledge, reading comprehension & logic.
# =============================================================================

# 1. FineWeb-Edu (Score >= 3 Educational Web Knowledge & Reading Comprehension)
[[data.sources]]
name = "fineweb_edu"
type = "hf"
hf_name = "HuggingFaceFW/fineweb-edu"
hf_config = "sample-10BT"
hf_split = "train"
text_field = "text"
min_chars = 200
max_tokens = 150_000_000
stages = ["pretrain"]
weight = 0.43
enabled = true

# 2. Cosmopedia-v2 (Synthetic Textbooks, Stories, Guides & Structured Articles)
[[data.sources]]
name = "cosmopedia_v2"
type = "hf"
hf_name = "HuggingFaceTB/smollm-corpus"
hf_config = "cosmopedia-v2"
hf_split = "train"
text_field = "text"
min_chars = 200
max_tokens = 100_000_000
stages = ["pretrain"]
weight = 0.29
enabled = true

# 3. TinyStories (Everyday Narrative Fluency, Dialogue & Commonsense Context)
[[data.sources]]
name = "tinystories"
type = "hf"
hf_name = "roneneldan/TinyStories"
hf_config = "default"
hf_split = "train"
text_field = "text"
min_chars = 100
max_tokens = 40_000_000
stages = ["pretrain"]
weight = 0.12
enabled = true

# 4. FineMath-4plus (Step-by-Step Mathematical & Logical Thinking, Score 4-5)
[[data.sources]]
name = "finemath_4plus"
type = "hf"
hf_name = "HuggingFaceTB/finemath"
hf_config = "finemath-4plus"
hf_split = "train"
text_field = "text"
min_chars = 150
max_tokens = 35_000_000
stages = ["pretrain"]
weight = 0.10
enabled = true

# 5. OpenCoder Algorithmic Corpus (Python & Structured Algorithmic Logic)
[[data.sources]]
name = "opencoder_python"
type = "hf"
hf_name = "OpenCoder-LLM/opc-annealing-corpus"
hf_config = "algorithmic_corpus"
hf_split = "train"
text_field = "text"
min_chars = 120
max_tokens = 25_000_000
stages = ["pretrain"]
weight = 0.06
enabled = true

# =============================================================================
# STAGE 2: SFT CONVERSATIONAL & CONTEXT ALIGNMENT (~90M Tokens Total)
# 85% Natural Multi-Turn Dialogue & Instruction + 15% CoT Reasoning
# =============================================================================

# 6. SmolTalk (Modern Multi-Turn Instruction, Summarization & Everyday Chat)
[[data.sources]]
name = "smoltalk_sft"
type = "hf"
hf_name = "HuggingFaceTB/smoltalk"
hf_config = "all"
hf_split = "train"
text_field = "messages"
min_chars = 48
max_tokens = 45_000_000
stages = ["sft"]
weight = 0.50
enabled = true

# 7. UltraChat-200k (Rich Multi-Turn Human-Like Conversations & Context Tracking)
[[data.sources]]
name = "ultrachat_sft"
type = "hf"
hf_name = "HuggingFaceH4/ultrachat_200k"
hf_config = "default"
hf_split = "train_sft"
text_field = "messages"
min_chars = 64
max_tokens = 30_000_000
stages = ["sft"]
weight = 0.35
enabled = true

# 8. OpenThoughts3-1.2M (Concise CoT Reasoning for Logic & Science Questions)
[[data.sources]]
name = "openthoughts3"
type = "hf"
hf_name = "open-thoughts/OpenThoughts3-1.2M"
hf_config = "default"
hf_split = "train"
text_field = "conversations"
min_chars = 128
max_tokens = 15_000_000
stages = ["sft"]
weight = 0.15
enabled = true

# 9. OpenR1-Math-220k (Disabled by default so heavy LaTeX does not overpower natural chat)
[[data.sources]]
name = "openr1_math"
type = "hf"
hf_name = "open-r1/OpenR1-Math-220k"
hf_config = "default"
hf_split = "train"
text_field = "messages"
min_chars = 128
max_tokens = 10_000_000
stages = ["sft"]
weight = 0.0
enabled = false

# =============================================================================
# DYNAMIC DATA BLENDING SCHEDULE (WSD DATA ANNEALING / CURRICULUM)
# Focuses on high-clarity structured textbooks & knowledge during final 20% decay.
# =============================================================================
[[data.phases]]
until = 0.80
weights = { fineweb_edu = 0.43, cosmopedia_v2 = 0.29, tinystories = 0.12, finemath_4plus = 0.10, opencoder_python = 0.06 }

[[data.phases]]
until = 1.0
weights = { fineweb_edu = 0.40, cosmopedia_v2 = 0.35, tinystories = 0.07, finemath_4plus = 0.11, opencoder_python = 0.07 }
