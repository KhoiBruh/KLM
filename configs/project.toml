# =============================================================================
# 1. CẤU HÌNH DỰ ÁN & MÔI TRƯỜNG THỰC THI (configs/project.toml)
# =============================================================================

[project]
name = "klm-10m"
seed = 42
device = "cuda"               # Tự động fallback về "cpu" nếu không có GPU
dtype = "bfloat16"            # Hỗ trợ: "float32", "float16", "bfloat16", "fp8"
compile = true                # Bật torch.compile(mode="max-autotune")
checkpoint_dir = "checkpoints"
tokenizer_dir = "tokenizer"
save_format = "safetensors"    # Lưu trọng số chuẩn .safetensors (mmap 0-copy)
max_shard_size_gb = 4.0       # Tự động tách thành nhiều shard .safetensors khi mô hình vượt ngưỡng (dùng cho 1B - 7B+)
