# =============================================================================
# 1. PROJECT & EXECUTION ENVIRONMENT CONFIGURATION (configs/project.toml)
# =============================================================================

[project]
name = "klm-200m"
seed = 42
device = "cuda"               # Automatically falls back to "cpu" if CUDA is unavailable
dtype = "bfloat16"            # Supported: "float32", "float16", "bfloat16", "fp8"
compile = false               # Set true on Linux servers for torch.compile; false avoids initial autotune lag
checkpoint_dir = "checkpoints"
tokenizer_dir = "tokenizer"
save_format = "safetensors"    # Save weights in standard .safetensors (zero-copy mmap)
max_shard_size_gb = 4.0       # Auto-shard safetensors when model exceeds threshold (1B - 7B+)
